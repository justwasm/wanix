name: v86 archive rebuild

on:
  workflow_dispatch:
    inputs:
      v86_release:
        description: copy/v86 release tag providing the runtime assets
        required: true
        default: latest
      publish_tag:
        description: Existing Wanix runtime release tag to replace v86.tgz in
        required: true
        type: string

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild v86.tgz for an existing runtime release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch matching upstream v86 runtime
        env:
          V86_RELEASE: ${{ inputs.v86_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v86/bundle
          tag="$(gh release view "$V86_RELEASE" --repo copy/v86 --json tagName -q .tagName)"
          gh release download "$tag" --repo copy/v86 \
            --pattern 'libv86.mjs' \
            --pattern 'v86.wasm' \
            --dir v86/bundle
          mv v86/bundle/libv86.mjs v86/lib.js
          node v86/test-wasm-exports.mjs v86/bundle/v86.wasm
          for bios in seabios.bin vgabios.bin; do
            curl --fail --location --retry 3 \
              -o "v86/bundle/${bios}" \
              "https://raw.githubusercontent.com/copy/v86/${tag}/bios/${bios}"
          done

      - name: Build and verify v86 archive
        run: |
          GOWORK=off GOOS=js GOARCH=wasm go build -C v86 -o bundle/v86-vm.wasm .
          tar -C v86/bundle -czf v86/v86.tgz v86.wasm v86-vm.wasm seabios.bin vgabios.bin
          for asset in v86.wasm v86-vm.wasm seabios.bin vgabios.bin; do
            tar -tf v86/v86.tgz "$asset" >/dev/null
          done

      - name: Replace v86 archive on the runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          gh release view "$PUBLISH_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$PUBLISH_TAG" v86/v86.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
