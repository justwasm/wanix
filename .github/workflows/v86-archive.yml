name: v86 emulator archive

on:
  workflow_dispatch:
    inputs:
      v86_release:
        description: copy/v86 release tag providing v86.wasm
        required: true
        default: latest
      publish_tag:
        description: Release tag to create or update in this repository
        required: true
        default: v86-archive-manual

permissions:
  contents: write

jobs:
  build:
    name: Build and publish v86.tgz
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wanix JavaScript dependencies
        run: npm ci

      - name: Fetch matching upstream v86 runtime
        env:
          V86_RELEASE: ${{ inputs.v86_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v86/bundle
          tag="$(gh release view "$V86_RELEASE" --repo copy/v86 --json tagName -q .tagName)"
          echo "V86_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --repo copy/v86 \
            --pattern 'libv86.mjs' \
            --pattern 'v86.wasm' \
            --dir v86/bundle
          mv v86/bundle/libv86.mjs v86/lib.js
          test -s v86/lib.js
          test -s v86/bundle/v86.wasm

      - name: Fetch matching upstream v86 BIOS images
        env:
          V86_REPO: copy/v86
        run: |
          for bios in seabios.bin vgabios.bin; do
            curl --fail --location --retry 3 \
              -o "v86/bundle/${bios}" \
              "https://raw.githubusercontent.com/${V86_REPO}/${V86_TAG}/bios/${bios}"
          done

      - name: Verify v86 JS and Wasm ABI
        run: node v86/test-wasm-exports.mjs v86/bundle/v86.wasm

      - name: Build v86-vm.wasm
        working-directory: v86
        env:
          GOOS: js
          GOARCH: wasm
          GOWORK: "off"
        run: go build -o ./bundle/v86-vm.wasm .

      - name: Bundle v86.tgz
        working-directory: v86
        run: tar -C bundle -czf v86.tgz v86.wasm v86-vm.wasm seabios.bin vgabios.bin

      - name: Inspect archive contents
        working-directory: v86
        run: |
          tar -tzf v86.tgz | sort
          for asset in v86.wasm v86-vm.wasm seabios.bin vgabios.bin; do
            tar -tf v86.tgz "$asset" >/dev/null
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v86-archive
          path: v86/v86.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v86-archive
          path: v86

      - name: Publish to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          if ! gh release view "$PUBLISH_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PUBLISH_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Wanix v86 emulator $PUBLISH_TAG" \
              --notes "Bundles v86.wasm, v86-vm.wasm, seabios.bin, and vgabios.bin for the Wanix v86 backend."
          fi
          gh release upload "$PUBLISH_TAG" \
            v86/v86.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
